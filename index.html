<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="M Monir Shokohyan — full-stack web & mobile developer (React, TypeScript, Node.js, React Native)."
    />
    <link rel="canonical" href="https://port-monir.netlify.app/" />
    <!-- Link previews (WhatsApp, LinkedIn, email, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://port-monir.netlify.app/" />
    <meta property="og:title" content="M Monir Shokohyan — Web Designer & Developer" />
    <meta
      property="og:description"
      content="Full-stack web & mobile developer and designer. React, TypeScript, Node.js, React Native — see my projects and skills."
    />
    <meta property="og:image" content="https://port-monir.netlify.app/webshot.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts used above the fold: fetch them in parallel with the JS bundle -->
    <link rel="preload" href="/fonts/Vazirmatn-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>M Monir's Portfolio</title>
    <style>
      /* Paint the dark background before the CSS bundle arrives (avoids a white flash) */
      html, body { background-color: #000; color: #fff; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Ethora AI chat ("Portfolio Chatbot" app). async: the widget must never hold up the page -->
    <script
      async
      src="https://app.chat.ethora.com/widget/assistant-a86891ff.js"
      id="chat-content-assistant"
      data-app-id="6ad745ceca753490abe0a7e2"
      data-api-base="https://api.chat.ethora.com/v1"
    ></script>
  </body>
</html>
